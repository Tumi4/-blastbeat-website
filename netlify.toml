[build]
  publish = "."

# Netlify Functions — /api/beat proxies to Claude API for the in-page AI chatbot.
# Set ANTHROPIC_API_KEY in Site settings → Environment variables.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Friendly path for the Beat AI endpoint. The function also declares
# `config.path = "/api/beat"` natively, but this redirect is belt-and-
# suspenders in case the v2 routing isn't honored on first deploy.
[[redirects]]
  from = "/api/beat"
  to = "/.netlify/functions/beat"
  status = 200
  force = true

# Admin backend + public licence registry: routed ONLY by each function's
# native config.path (/api/admin/*, /api/verify/*). Do NOT add redirect
# rules pointing at /.netlify/functions/admin-api or /verify-licence —
# a function that declares config.path is NOT reachable at its default
# /.netlify/functions/<name> URL, so such a redirect intercepts the
# request and turns it into a 404 (launch-day incident, 2026-07-11).

# Public verify route. Printed licence certificates carry a QR pointing at
# /verify/<short-id>; the rewrite hands that ID to the verify page as ?id=
# so the URL the sponsor sees stays clean.
[[redirects]]
  from = "/verify"
  to = "/pages/verify.html"
  status = 200
[[redirects]]
  from = "/verify/*"
  to = "/pages/verify.html?id=:splat"
  status = 200

# ------------------------------------------------------------------
# INTERNAL FILES — never serve from the public CDN. publish = "." means
# everything in the repo deploys as a static asset, so these force-404
# rules are the fence. force = true is REQUIRED: without it Netlify
# serves an existing file in preference to the redirect rule.
# (Launch-audit fix, 2026-07-03: data/programme-data.json was publicly
# fetchable with live sponsor-pipeline contacts in it.)
# ------------------------------------------------------------------
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/proposal-engine-kit/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Demo access landing — clean URL for the request-access form. After signup
# the lead is sent straight to the live Blastbeat V2 app (Trixta-hosted at
# trx-3675.devspace.trixta.io); Robert + Tumelo follow up personally by email.
[[redirects]]
  from = "/demo"
  to = "/pages/demo.html"
  status = 200

# Internal presenter run-sheet (noindex) — clean URL for live demo calls.
[[redirects]]
  from = "/demo-guide"
  to = "/pages/demo-guide.html"
  status = 200

# Ambassador trackable links — /r/<slug> is the personal link every
# ambassador (partner or artist) shares. Lands on the sponsorship page
# with the ref attached; analytics.js persists it and stamps it into any
# form the visitor later submits, so attribution reaches the ledger.
[[redirects]]
  from = "/r/*"
  to = "/pages/partners.html?ref=:splat&utm_source=ambassador&utm_medium=referral"
  status = 302

# Artist ambassador programme + private invite pages (invites are noindex;
# Robert sends these URLs personally).
[[redirects]]
  from = "/artist-ambassadors"
  to = "/pages/artist-ambassadors.html"
  status = 200

[[redirects]]
  from = "/invite/*"
  to = "/pages/invites/:splat.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.iframe.ly https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ytimg.com https://*.ytimg.com https://*.ggpht.com https://irp.cdn-website.com https://*.cdn-website.com https://drive.google.com https://*.googleusercontent.com https://cdn.iframe.ly https://api.qrserver.com https://www.googletagmanager.com https://*.google-analytics.com https://www.google.com https://www.google.co.uk https://www.google.co.za https://www.google.ie; connect-src 'self' https://cdn.iframe.ly https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://demo.blastbeat.com https://app.blastbeat.com https://trx-3675.devspace.trixta.io https://*.devspace.trixta.io; frame-src 'self' https://drive.google.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://cdn.iframe.ly https://*.iframe.ly https://www.googletagmanager.com https://demo.blastbeat.com https://app.blastbeat.com https://trx-3675.devspace.trixta.io https://*.devspace.trixta.io; media-src 'self' https://drive.google.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests"

# Admin dashboard: never cache, never index. The page is also gated by
# the server-checked access code, but no copy of it should sit in any
# shared cache or search index either.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets (1 year)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cache for HTML
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Custom 404 — only for pages, not assets
# Netlify automatically serves 404.html for missing pages when the file exists
